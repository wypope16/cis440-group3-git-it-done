<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Manager Dashboard - Recent Check-ins</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        .logout-btn {
            float: right;
            padding: 8px 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }

        .checkin-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #f9f9f9;
        }

        .checkin-header {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        .checkin-body p {
            margin: 8px 0;
        }

        .empty-msg {
            font-style: italic;
            color: #666;
            font-size: 1.1em;
        }

        /* US-07 Frequency Setting Styles */
        .frequency-section {
            background: #f9f9f9;
            border: 1px solid #777;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }

            .frequency-section h3 {
                margin-top: 0;
            }

        .frequency-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

            .frequency-row label {
                font-weight: bold;
            }

        #frequencyDays {
            width: 90px;
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #saveFrequencyButton {
            padding: 8px 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #0056b3;
            color: white;
        }

            #saveFrequencyButton:disabled {
                cursor: not-allowed;
                opacity: 0.7;
            }

        .frequency-status {
            min-height: 22px;
            margin: 10px 0 0;
            font-weight: bold;
        }

            .frequency-status.success {
                color: #146c2e;
            }

            .frequency-status.error {
                color: #b00020;
            }

        /* US-10 Summary Styles */
        .summary-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-box {
            flex: 1;
            border: 1px solid #0056b3;
            border-radius: 8px;
            padding: 15px;
            background: #e6f2ff;
        }

            .summary-box h3 {
                margin-top: 0;
                color: #0056b3;
                border-bottom: 1px solid #0056b3;
                padding-bottom: 5px;
            }

        .summary-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

            .summary-list li {
                padding: 5px 0;
                border-bottom: 1px dashed #ccc;
                display: flex;
                justify-content: space-between;
            }

        /* US-11 Filter Styles */
        .filter-section {
            background: #e6f2ff;
            border: 1px solid #0056b3;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

            .filter-section h3 {
                margin-top: 0;
                color: #0056b3;
            }

        .filter-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

            .filter-group label {
                font-size: 0.9em;
                font-weight: bold;
                margin-bottom: 4px;
            }

            .filter-group select,
            .filter-group input {
                padding: 5px;
                border-radius: 4px;
                border: 1px solid #ccc;
            }

        .filter-actions {
            margin-top: 10px;
        }

            .filter-actions button {
                padding: 6px 12px;
                cursor: pointer;
                border-radius: 4px;
                border: none;
            }

        .btn-apply {
            background: #0056b3;
            color: white;
            margin-right: 10px;
        }

        .btn-clear {
            background: #6c757d;
            color: white;
        }
    </style>
</head>

<body>
    <button class="logout-btn"
            type="button"
            onclick="logoutManager()">
        Logout
    </button>

    <h2>Manager Dashboard</h2>
    <hr>

    <!-- US-07: Manager-controlled saved frequency -->
    <section class="frequency-section"
             id="frequencySettings">

        <h3>Check-In Frequency</h3>

        <p>
            Set the minimum number of days required
            between accepted anonymous employee
            check-ins.
        </p>

        <div class="frequency-row">
            <label for="frequencyDays">
                Days between check-ins:
            </label>

            <input type="number"
                   id="frequencyDays"
                   min="1"
                   max="365"
                   step="1"
                   required
                   aria-describedby="frequencyStatus" />

            <button type="button"
                    id="saveFrequencyButton"
                    onclick="saveCheckInFrequency()">
                Save Frequency
            </button>
        </div>

        <p id="frequencyStatus"
           class="frequency-status"
           role="status"
           aria-live="polite"></p>
    </section>

    <!-- US-10 Summary -->
    <div class="summary-container"
         id="summaryContainer"
         style="display: none;">

        <div class="summary-box">
            <h3>Moods Summary</h3>

            <ul class="summary-list"
                id="moodSummaryList">
            </ul>
        </div>

        <div class="summary-box">
            <h3>Workplace Factors</h3>

            <ul class="summary-list"
                id="factorSummaryList">
            </ul>
        </div>
    </div>

    <!-- US-11 Filter Menu -->
    <div class="filter-section">
        <h3>Filter Feedback</h3>

        <div class="filter-row">

            <div class="filter-group">
                <label for="filterMood">
                    Mood
                </label>

                <select id="filterMood">
                    <option value="">
                        All Moods
                    </option>

                    <option value="Good">
                        Good
                    </option>

                    <option value="Neutral">
                        Neutral
                    </option>

                    <option value="Stressed">
                        Stressed
                    </option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filterFactor">
                    Workplace Factor
                </label>

                <select id="filterFactor">
                    <option value="">
                        All Factors
                    </option>

                    <option value="Workload">
                        Workload
                    </option>

                    <option value="Team Relationships">
                        Team Relationships
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Management">
                        Management
                    </option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filterStartDate">
                    Start Date
                </label>

                <input type="date"
                       id="filterStartDate" />
            </div>

            <div class="filter-group">
                <label for="filterEndDate">
                    End Date
                </label>

                <input type="date"
                       id="filterEndDate" />
            </div>

        </div>

        <div class="filter-actions">

            <button class="btn-apply"
                    type="button"
                    onclick="applyFilters()">
                Apply Filters
            </button>

            <button class="btn-clear"
                    type="button"
                    onclick="clearFilters()">
                Clear Filters
            </button>

        </div>
    </div>

    <h3>Recent Anonymous Check-ins</h3>

    <div id="checkinContainer">
        <p>Loading recent check-ins...</p>
    </div>

    <script type="text/javascript">

        // US-11
        let allCheckIns = [];

        function logoutManager() {
            $.ajax({
                type: "POST",

                url:
                    "ProjectServices.asmx/"
                    + "LogoutManager",

                data: "{}",

                contentType:
                    "application/json; "
                    + "charset=utf-8",

                dataType: "json",

                complete: function () {
                    sessionStorage.removeItem(
                        "isManager"
                    );

                    window.location.href =
                        "manager-login.html";
                }
            });
        }

        // ============================================================
        // US-07
        // Load the currently saved frequency.
        // ============================================================
        function loadCheckInFrequency() {

            const input =
                document.getElementById(
                    "frequencyDays"
                );

            const statusBox =
                document.getElementById(
                    "frequencyStatus"
                );

            statusBox.textContent =
                "Loading saved frequency...";

            statusBox.className =
                "frequency-status";

            $.ajax({
                type: "POST",

                url:
                    "ProjectServices.asmx/"
                    + "GetCheckInFrequency",

                data: "{}",

                contentType:
                    "application/json; "
                    + "charset=utf-8",

                dataType: "json",

                success: function (msg) {

                    const result = msg.d;

                    if (
                        result
                        && result.Success
                    ) {
                        input.value =
                            result.FrequencyDays;

                        statusBox.textContent =
                            "Current setting: "
                            + result.FrequencyDays
                            + (
                                result.FrequencyDays
                                    === 1
                                    ? " day between "
                                    + "check-ins."
                                    : " days between "
                                    + "check-ins."
                            );

                        statusBox.className =
                            "frequency-status "
                            + "success";
                    }
                    else {
                        statusBox.textContent =
                            result
                                && result.Message
                                ? result.Message
                                : "The current "
                                + "check-in frequency "
                                + "could not be "
                                + "loaded.";

                        statusBox.className =
                            "frequency-status "
                            + "error";
                    }
                },

                error: function () {

                    statusBox.textContent =
                        "The current check-in "
                        + "frequency could not "
                        + "be loaded.";

                    statusBox.className =
                        "frequency-status error";
                }
            });
        }

        // ============================================================
        // US-07
        // Validate and save manager frequency.
        // ============================================================
        function saveCheckInFrequency() {

            const input =
                document.getElementById(
                    "frequencyDays"
                );

            const statusBox =
                document.getElementById(
                    "frequencyStatus"
                );

            const saveButton =
                document.getElementById(
                    "saveFrequencyButton"
                );

            const frequencyDays =
                Number(input.value);

            statusBox.textContent = "";

            statusBox.className =
                "frequency-status";

            if (
                !Number.isInteger(
                    frequencyDays
                )
                || frequencyDays < 1
                || frequencyDays > 365
            ) {
                statusBox.textContent =
                    "Enter a whole number "
                    + "between 1 and "
                    + "365 days.";

                statusBox.className =
                    "frequency-status error";

                input.focus();

                return;
            }

            saveButton.disabled =
                true;

            saveButton.textContent =
                "Saving...";

            const parameters =
                JSON.stringify({
                    frequencyDays:
                        frequencyDays
                });

            $.ajax({
                type: "POST",

                url:
                    "ProjectServices.asmx/"
                    + "SaveCheckInFrequency",

                data: parameters,

                contentType:
                    "application/json; "
                    + "charset=utf-8",

                dataType: "json",

                success: function (msg) {

                    const result = msg.d;

                    statusBox.textContent =
                        result
                            && result.Message
                            ? result.Message
                            : "The frequency "
                            + "setting could "
                            + "not be saved.";

                    statusBox.className =
                        result
                            && result.Success
                            ? "frequency-status "
                            + "success"
                            : "frequency-status "
                            + "error";

                    if (
                        result
                        && result.Success
                    ) {
                        input.value =
                            result.FrequencyDays;
                    }
                },

                error: function () {

                    statusBox.textContent =
                        "The frequency "
                        + "setting could "
                        + "not be saved.";

                    statusBox.className =
                        "frequency-status error";
                },

                complete: function () {

                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "Save Frequency";
                }
            });
        }

        // ============================================================
        // Existing US-11 check-in renderer
        // ============================================================
        function renderCheckIns(
            dataToRender
        ) {
            const container =
                $("#checkinContainer");

            container.empty();

            if (
                dataToRender.length === 0
            ) {
                container.append(
                    "<p class='empty-msg'>"
                    + "No anonymous check-ins "
                    + "match the criteria."
                    + "</p>"
                );

                return;
            }

            dataToRender.forEach(
                function (record) {

                    const card = `
                            <div class="checkin-card">
                                <div class="checkin-header">
                                    Date:
                                    ${record.SubmissionDate}
                                    |
                                    Mood:
                                    ${record.Mood}
                                    |
                                    Factor:
                                    ${record.WorkplaceFactor}
                                </div>

                                <div class="checkin-body">
                                    <p>
                                        <strong>
                                            Cause:
                                        </strong>
                                        ${record.CauseText}
                                    </p>

                                    <p>
                                        <strong>
                                            Recommendation:
                                        </strong>
                                        ${record.RecommendationText}
                                    </p>
                                </div>
                            </div>
                        `;

                    container.append(
                        card
                    );
                }
            );
        }

        // ============================================================
        // Existing US-11 filter logic
        // ============================================================
        function applyFilters() {

            const mood =
                $("#filterMood").val();

            const factor =
                $("#filterFactor").val();

            const startDate =
                $("#filterStartDate").val();

            const endDate =
                $("#filterEndDate").val();

            const filteredData =
                allCheckIns.filter(
                    function (record) {

                        let isMatch =
                            true;

                        if (
                            mood !== ""
                            && record.Mood
                            !== mood
                        ) {
                            isMatch =
                                false;
                        }

                        if (
                            factor !== ""
                            && record
                                .WorkplaceFactor
                            !== factor
                        ) {
                            isMatch =
                                false;
                        }

                        if (
                            startDate
                            || endDate
                        ) {
                            const recordDate =
                                new Date(
                                    record
                                        .SubmissionDate
                                );

                            if (startDate) {

                                const start =
                                    new Date(
                                        startDate
                                        + "T00:00:00"
                                    );

                                if (
                                    recordDate
                                    < start
                                ) {
                                    isMatch =
                                        false;
                                }
                            }

                            if (endDate) {

                                const end =
                                    new Date(
                                        endDate
                                        + "T23:59:59"
                                    );

                                if (
                                    recordDate
                                    > end
                                ) {
                                    isMatch =
                                        false;
                                }
                            }
                        }

                        return isMatch;
                    }
                );

            renderCheckIns(
                filteredData
            );
        }

        function clearFilters() {

            $("#filterMood").val("");

            $("#filterFactor").val("");

            $("#filterStartDate").val("");

            $("#filterEndDate").val("");

            renderCheckIns(
                allCheckIns
            );
        }

        // ============================================================
        // Page startup
        // ============================================================
        $(document).ready(
            function () {

                // US-08 manager-login protection.
                if (
                    sessionStorage.getItem(
                        "isManager"
                    ) !== "true"
                ) {
                    window.location.href =
                        "manager-login.html";

                    return;
                }

                // US-07
                // Load saved frequency.
                loadCheckInFrequency();

                // US-10
                // Load dashboard summaries.
                $.ajax({
                    type: "POST",

                    url:
                        "ProjectServices.asmx/"
                        + "GetDashboardSummary",

                    data: "{}",

                    contentType:
                        "application/json; "
                        + "charset=utf-8",

                    dataType: "json",

                    success: function (msg) {

                        const summary =
                            msg.d;

                        if (summary) {

                            $("#summaryContainer")
                                .show();

                            const moodList =
                                $("#moodSummaryList");

                            moodList.empty();

                            if (
                                summary.Moods
                                    .length === 0
                            ) {
                                moodList.append(
                                    "<li>"
                                    + "<span "
                                    + "class='empty-msg'>"
                                    + "No mood data"
                                    + "</span>"
                                    + "</li>"
                                );
                            }
                            else {
                                summary.Moods
                                    .forEach(
                                        function (
                                            mood
                                        ) {
                                            moodList
                                                .append(
                                                    `
                                                        <li>
                                                            <span>
                                                                ${mood.Mood}
                                                            </span>

                                                            <strong>
                                                                ${mood.Count}
                                                            </strong>
                                                        </li>
                                                        `
                                                );
                                        }
                                    );
                            }

                            const factorList =
                                $(
                                    "#factorSummaryList"
                                );

                            factorList.empty();

                            if (
                                summary.Factors
                                    .length === 0
                            ) {
                                factorList.append(
                                    "<li>"
                                    + "<span "
                                    + "class='empty-msg'>"
                                    + "No factor data"
                                    + "</span>"
                                    + "</li>"
                                );
                            }
                            else {
                                summary.Factors
                                    .forEach(
                                        function (
                                            factor
                                        ) {
                                            factorList
                                                .append(
                                                    `
                                                        <li>
                                                            <span>
                                                                ${factor.Factor}
                                                            </span>

                                                            <strong>
                                                                ${factor.Count}
                                                            </strong>
                                                        </li>
                                                        `
                                                );
                                        }
                                    );
                            }
                        }
                    }
                });

                // US-09
                // Load recent check-ins.
                $.ajax({
                    type: "POST",

                    url:
                        "ProjectServices.asmx/"
                        + "GetRecentCheckIns",

                    data: "{}",

                    contentType:
                        "application/json; "
                        + "charset=utf-8",

                    dataType: "json",

                    success: function (msg) {

                        allCheckIns =
                            msg.d || [];

                        renderCheckIns(
                            allCheckIns
                        );
                    },

                    error: function () {

                        $("#checkinContainer")
                            .html(
                                "<p "
                                + "class='empty-msg' "
                                + "style='color:red;'>"
                                + "Oops! Error "
                                + "loading check-ins. "
                                + "Please check the "
                                + "database connection."
                                + "</p>"
                            );
                    }
                });
            }
        );

    </script>
</body>
</html>
