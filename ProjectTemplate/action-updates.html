<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Management Action Updates</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        .nav-link {
            display: inline-block;
            margin-bottom: 15px;
        }

        .update-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #f9f9f9;
        }

        .update-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .update-description {
            margin: 8px 0;
        }

        .update-status {
            font-weight: bold;
            margin-top: 8px;
        }

        .update-date {
            color: #666;
            font-size: 0.9em;
            margin-top: 6px;
        }

        .empty-msg {
            font-style: italic;
            color: #666;
            font-size: 1.1em;
        }

        .error-msg {
            color: red;
        }
    </style>
</head>

<body>
    <h2>Management Action Updates</h2>

    <p>
        View recent updates from management about workplace concerns and actions being taken.
    </p>

    <p>
        <a class="nav-link" href="index.html">Back to mood check-in</a>
    </p>

    <hr>

    <div id="updatesContainer">
        <p class="empty-msg">Loading management action updates...</p>
    </div>

    <script type="text/javascript">
        $(document).ready(function () {
            const container = $("#updatesContainer");

            function showMessage(message, isError) {
                container.empty();

                const messageElement = $("<p>")
                    .addClass("empty-msg")
                    .text(message);

                if (isError) {
                    messageElement.addClass("error-msg");
                }

                container.append(messageElement);
            }

            $.ajax({
                type: "POST",
                url: "ProjectServices.asmx/GetManagementActionUpdates",
                data: "{}",
                contentType: "application/json; charset=utf-8",
                dataType: "json",

                success: function (msg) {
                    const updates = msg.d;
                    container.empty();

                    if (!updates || updates.length === 0) {
                        showMessage("No management action updates have been posted yet.", false);
                        return;
                    }

                    updates.forEach(function (update) {
                        const card = $("<div>").addClass("update-card");

                        const title = $("<div>")
                            .addClass("update-title")
                            .text(update.Title || "");

                        const description = $("<p>")
                            .addClass("update-description")
                            .text(update.Description || "");

                        const status = $("<div>")
                            .addClass("update-status")
                            .text("Status: " + (update.Status || ""));

                        const date = $("<div>")
                            .addClass("update-date")
                            .text("Date: " + (update.UpdateDate || ""));

                        card.append(title, description, status, date);
                        container.append(card);
                    });
                },

                error: function () {
                    showMessage("Oops! Could not load management action updates right now.", true);
                }
            });
        });
    </script>
</body>
</html>
