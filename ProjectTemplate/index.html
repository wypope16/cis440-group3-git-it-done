<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title></title>

	<!--DO NOT FORGET THIS SCRIPT TAG SO YOU CAN USE JQUERY!!!!!-->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

	<!--YOUR OWN JAVASCRIPT CAN GO RIGHT HERE-->
	<script type="text/javascript">

		function TestButtonHandler() {
			var webMethod = "ProjectServices.asmx/TestConnection";
			var parameters = "{}";

			//jQuery ajax method
			$.ajax({
				type: "POST",
				url: webMethod,
				data: parameters,
				contentType: "application/json; charset=utf-8",
				dataType: "json",
				success: function (msg) {
					var responseFromServer = msg.d;
					alert(responseFromServer);
				},
				error: function (e) {
					alert("this code will only execute if javascript is unable to access the webservice");
				}
			});
		}

		function validateFactor() {
			let selectedFactor = document.querySelector('input[name="factor"]:checked');

			if (!selectedFactor) {
				document.getElementById("factorError").style.display = "block";
				return false;
			}

			document.getElementById("factorError").style.display = "none";
			return true;
		}

        function validateCause() {
            let causeField = document.getElementById("causeText");
            let causeError = document.getElementById("causeError");
            let cause = causeField.value.trim();

            if (cause === "") {
                causeError.style.display = "block";
                causeField.setAttribute("aria-invalid", "true");
                return false;
            }

            causeError.style.display = "none";
            causeField.setAttribute("aria-invalid", "false");
            return true;
        }

        function clearCauseError() {
            let causeField = document.getElementById("causeText");

            if (causeField.value.trim() !== "") {
                document.getElementById("causeError").style.display = "none";
                causeField.setAttribute("aria-invalid", "false");
            }
        }

        function validateRecommendation() {
            let recommendationField = document.getElementById("recommendationText");
            let recommendationError = document.getElementById("recommendationError");
            let recommendation = recommendationField.value.trim();

            if (recommendation === "") {
                recommendationError.style.display = "block";
                recommendationField.setAttribute("aria-invalid", "true");
                return false;
            }

            recommendationError.style.display = "none";
            recommendationField.setAttribute("aria-invalid", "false");
            return true;
        }

        function clearRecommendationError() {
            let recommendationField = document.getElementById("recommendationText");

            if (recommendationField.value.trim() !== "") {
                document.getElementById("recommendationError").style.display = "none";
                recommendationField.setAttribute("aria-invalid", "false");
            }
        }

	</script>
	<!--END OF YOUR OWN JAVASCRIPT-->

	<!--AND YOUR OWN CSS CAN GO HERE AS WELL-->
	<style>

	</style>
	<!--END OF YOUR OWN CSS-->

</head>

<body>

	<button onclick="if(validateFactor()) TestButtonHandler();">
		Click here to test connection!
	</button>

	<hr>

	<h3>Select Workplace Factor</h3>

	<input type="radio" name="factor" value="Workload"> Workload<br>
	<input type="radio" name="factor" value="Management"> Management<br>
	<input type="radio" name="factor" value="Scheduling"> Scheduling<br>
	<input type="radio" name="factor" value="Technology"> Technology<br>
	<input type="radio" name="factor" value="Communication"> Communication<br>
	<input type="radio" name="factor" value="Team Relationships"> Team Relationships<br>
	<input type="radio" name="factor" value="Workplace Environment"> Workplace Environment<br>

	<p id="factorError" style="color:red; display:none;">
		Please select a workplace factor.
	</p>
	<hr>

	<h3>Mood Explanation</h3>

	<label for="causeText">
		What caused your selected mood?
	</label>
	<br>

<textarea id="causeText"
		  name="causeText"
		  rows="5"
		  cols="50"
		  required
		  aria-required="true"
		  aria-invalid="false"
		  aria-describedby="causeError"
		  onblur="validateCause();"
		  oninput="clearCauseError();"></textarea>

	<p id="causeError"
	   role="alert"
	   style="color:red; display:none;">
		Please explain what caused your selected mood.
	</p>
	<hr>

	<h3>Actionable Recommendation</h3>

	<label for="recommendationText">
		What should the company improve or continue doing?
	</label>
	<br>

<textarea id="recommendationText"
		  name="recommendationText"
		  rows="5"
		  cols="50"
		  required
		  aria-required="true"
		  aria-invalid="false"
		  aria-describedby="recommendationError"
		  onblur="validateRecommendation();"
		  oninput="clearRecommendationError();">
</textarea>

	<p id="recommendationError"
	   role="alert"
	   style="color:red; display:none;">
		Please provide a recommendation.
	</p>

</body>
</html>
