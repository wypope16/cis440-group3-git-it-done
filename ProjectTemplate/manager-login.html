<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>Manager Login</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js">
    </script>

    <style>
        :root {
            --page-background: #f4f7f5;
            --surface: #ffffff;
            --primary: #2f6f65;
            --primary-dark: #1f514a;
            --heading: #163f3a;
            --text: #33413e;
            --muted: #65736f;
            --soft-green: #e6f0ec;
            --border: #cedbd6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 48px 20px;
            background-color: var(--page-background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.5;
        }

        .login-page {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-bottom: 22px;
            color: var(--primary-dark);
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
        }

            .back-link:hover {
                text-decoration: underline;
                text-underline-offset: 3px;
            }

            .back-link:focus-visible {
                border-radius: 3px;
                outline: 3px solid var(--primary);
                outline-offset: 4px;
            }

        .login-header {
            margin-bottom: 24px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--primary);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .login-header h1 {
            margin: 0 0 12px;
            color: var(--heading);
            font-size: clamp(2rem, 7vw, 2.75rem);
            line-height: 1.1;
        }

        .login-intro {
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .login-card {
            padding: 32px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background-color: var(--surface);
            box-shadow: 0 12px 32px rgba(22, 63, 58, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                margin-bottom: 7px;
                color: var(--heading);
                font-weight: 700;
            }

            .form-group input {
                display: block;
                width: 100%;
                padding: 12px 14px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background-color: #ffffff;
                color: var(--text);
                font: inherit;
            }

                .form-group input:focus {
                    border-color: var(--primary);
                    outline: 3px solid var(--soft-green);
                }

        #loginButton {
            width: 100%;
            padding: 13px 20px;
            border: 0;
            border-radius: 8px;
            background-color: var(--primary);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

            #loginButton:hover {
                background-color: var(--primary-dark);
            }

            #loginButton:focus-visible {
                outline: 3px solid var(--heading);
                outline-offset: 3px;
            }

            #loginButton:disabled {
                cursor: wait;
                opacity: 0.65;
            }

        #loginError {
            display: none;
            margin: 18px 0 0;
            padding: 12px 14px;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            background-color: #f8d7da;
            color: #721c24;
            font-weight: 700;
        }

        .security-note {
            margin: 20px 0 0;
            padding: 14px 16px;
            border-left: 4px solid var(--primary);
            border-radius: 6px;
            background-color: var(--soft-green);
            color: var(--heading);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            body {
                padding: 28px 14px;
            }

            .login-card {
                padding: 24px 20px;
                border-radius: 10px;
            }

            .login-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <main class="login-page">
        <a class="back-link" href="index.html">
            &larr; Back to Employee Check-In
        </a>

        <header class="login-header">
            <p class="eyebrow">MANAGER ACCESS</p>
            <h1>Manager Login</h1>

            <p class="login-intro">
                Sign in to review employee feedback, trends, and management
                action updates.
            </p>
        </header>

        <form class="login-card"
              id="loginForm"
              onsubmit="login(event)"
              novalidate>

            <div class="form-group">
                <label for="username">Username</label>

                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Enter your username"
                       autocomplete="username"
                       required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required />
            </div>

            <button type="submit" id="loginButton">
                Sign In
            </button>

            <p id="loginError"
               role="alert"
               aria-live="assertive"
               tabindex="-1">
                Invalid or blank credentials.
            </p>

            <p class="security-note">
                This area is restricted to authorized managers.
            </p>
        </form>
    </main>

    <script type="text/javascript">
        function showLoginError(message) {
            const loginError = document.getElementById("loginError");

            loginError.textContent = message;
            loginError.style.display = "block";
            loginError.focus();
        }

        function login(event) {
            event.preventDefault();

            const usernameInput = document.getElementById("username");
            const passwordInput = document.getElementById("password");
            const loginButton = document.getElementById("loginButton");
            const loginError = document.getElementById("loginError");

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            loginError.style.display = "none";

            if (username === "" || password === "") {
                showLoginError(
                    "Please enter both your username and password."
                );
                return;
            }

            if (loginButton.disabled) {
                return;
            }

            const parameters = JSON.stringify({
                username: username,
                password: password
            });

            loginButton.disabled = true;
            loginButton.textContent = "Signing In...";

            $.ajax({
                type: "POST",
                url: "ProjectServices.asmx/LoginManager",
                data: parameters,
                contentType: "application/json; charset=utf-8",
                dataType: "json",

                success: function (msg) {
                    const result = msg.d;

                    if (result.Success) {
                        sessionStorage.setItem("isManager", "true");
                        window.location.href = "manager-dashboard.html";
                    } else {
                        showLoginError(
                            "The username or password is incorrect."
                        );
                    }
                },

                error: function () {
                    showLoginError(
                        "Unable to sign in right now. Please try again."
                    );
                },

                complete: function () {
                    loginButton.disabled = false;
                    loginButton.textContent = "Sign In";
                }
            });
        }

        document
            .getElementById("username")
            .addEventListener("input", clearLoginError);

        document
            .getElementById("password")
            .addEventListener("input", clearLoginError);

        function clearLoginError() {
            document.getElementById("loginError").style.display = "none";
        }
    </script>
</body>
</html>
